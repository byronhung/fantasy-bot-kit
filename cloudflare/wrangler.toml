# One Cloudflare Worker does two jobs:
#  1. serves the dashboard (site/: index.html; report.json comes from the repo's "report" branch),
#     private by secret link
#  2. cron triggers that start the GitHub workflows on time (GitHub's own cron runs hours late)
# Deploy with `python -m fantasy_bot.setup cloudflare`: it passes YOUR worker name, REPO and BRANCH
# (--name / --var), so this file stays generic. A bare `wrangler deploy` would use the placeholders.
name = "fantasy-bot-board"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[vars]
REPO = "your-github-name/fantasy-bot"
BRANCH = "master"

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = true   # every request goes through the key check in worker.js

[triggers]
crons = ["0 7 * * *", "0 23 * * *", "*/20 0-5 * * *"]
