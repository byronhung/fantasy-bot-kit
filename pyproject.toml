[project]
name = "fantasy-bot"
version = "0.1.0"
description = "Daily H2H 9-cat waiver advisor for Yahoo Fantasy Basketball"
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright>=1.48",
    "python-dotenv>=1.0",
    "selectolax>=0.3",
    "tzdata>=2026.6",
    "websocket-client>=1.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fantasy_bot"]
